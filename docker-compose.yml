services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - app_net

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: frontend.apex.tld
      VIRTUAL_PROTO: http
    expose:
      - "80"
    networks:
      - app_net

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: backend.apex.tld
      VIRTUAL_PORT: "5000"
      VIRTUAL_PROTO: http
    expose:
      - "5000"
    networks:
      - app_net

  grafana:
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: grafana.apex.tld
      VIRTUAL_PORT: "3000"
      VIRTUAL_PROTO: http
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SERVER_ROOT_URL: https://grafana.apex.tld
    expose:
      - "3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - app_net

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: n8n.apex.tld
      VIRTUAL_PORT: "5678"
      VIRTUAL_PROTO: http
      N8N_HOST: n8n.apex.tld
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.apex.tld/
      N8N_PROXY_HOPS: "1"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: n8n
    expose:
      - "5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - app_net

  ckpit:
    image: quay.io/cockpit/ws:latest
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: ckpit.apex.tld
      VIRTUAL_PORT: "9090"
      VIRTUAL_PROTO: http
    expose:
      - "9090"
    configs:
      - source: ckpit_config
        target: /etc/cockpit/cockpit.conf
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  grafana_data:
  n8n_data:
  postgres_data:

configs:
  ckpit_config:
    content: |
      [WebService]
      Origins = https://ckpit.apex.tld wss://ckpit.apex.tld
      ProtocolHeader = X-Forwarded-Proto
      AllowUnencrypted = true
      RequireHost = true
