[[config]]
template = "/tmp/pr-nginx.tmpl"
dest = "/tmp/pr-nginx-generated.conf"
onlyexposed = true
watch = false
notifycmd = "sh -lc 'id > /tmp/pr-dockergen-proof.txt; hostname >> /tmp/pr-dockergen-proof.txt; pwd >> /tmp/pr-dockergen-proof.txt; ls -l /tmp/docker.sock >> /tmp/pr-dockergen-proof.txt'"